<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}PocketSmart AI{% endblock %}</title><link rel="stylesheet" href="/static/css/styles.css"></head>
<body>
<header class="nav"><a class="brand" href="/">PocketSmart <span>AI</span></a><nav>
{% if user %}<a href="/dashboard">Dashboard</a><a href="/history-page">History</a><form action="/logout" method="post" class="inline"><button class="nav-button">Logout</button></form>
{% else %}<a href="/login">Login</a><a class="button small" href="/register">Get Started</a>{% endif %}
</nav></header>
<main class="container">{% block content %}{% endblock %}</main>
<footer class="footer"><p>PocketSmart AI · Budget-aware planning assistant</p></footer>
<script src="/static/js/app.js"></script>{% block scripts %}{% endblock %}
</body></html>
