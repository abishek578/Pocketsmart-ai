{% extends "base.html" %}{% block title %}Party Planner — PocketSmart AI{% endblock %}{% block content %}
<div class="page-heading"><div><p class="eyebrow">PARTY PLANNER</p><h1>Plan the event budget</h1><p class="muted">Balance venue, catering, decor and entertainment around your guest count.</p></div></div>
<form id="party-form" class="panel planner-form"><div class="form-grid"><label>Total budget (₹)<input name="total_budget" type="number" min="1" required></label><label>Guest count<input name="guest_count" type="number" min="1" required></label><label>Event type<input name="event_type" placeholder="Birthday, wedding, corporate..." required></label><label>Venue type<input name="venue_type" value="hall"></label><label>City<input name="city" placeholder="Kochi, Palakkad..."></label></div><div class="checks"><label><input type="checkbox" name="catering_needed" checked> Catering</label><label><input type="checkbox" name="decoration_needed" checked> Decoration</label><label><input type="checkbox" name="entertainment_needed"> Entertainment</label></div><label>Additional requirements<textarea name="additional_requirements"></textarea></label><button class="button" type="submit">Generate Party Plan</button></form><div id="results" class="results"></div>{% endblock %}{% block scripts %}<script>initPartyPlanner();</script>{% endblock %}
