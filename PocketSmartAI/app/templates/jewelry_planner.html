{% extends "base.html" %}{% block title %}Jewelry Planner — PocketSmart AI{% endblock %}{% block content %}
<div class="page-heading"><div><p class="eyebrow">JEWELRY PLANNER</p><h1>Match jewelry to the occasion</h1><p class="muted">Optionally upload an outfit image. The model uses broad color/style cues, not identity.</p></div></div>
<form id="jewelry-form" class="panel planner-form" enctype="multipart/form-data"><div class="form-grid"><label>Total budget (₹)<input name="total_budget" type="number" min="1" required></label><label>Occasion<input name="occasion" placeholder="Wedding, party, formal..." required></label><label>Style preference<input name="style_preferences" value="elegant"></label><label>Metal preference<select name="metal_preference"><option>any</option><option>gold</option><option>silver</option><option>rose gold</option><option>oxidized</option></select></label><label>Color preference<input name="color_preference" placeholder="gold, silver, pearl, red..."></label></div><label>Outfit image (optional)<input name="outfit_image" type="file" accept="image/jpeg,image/png,image/webp"></label><label>Additional requirements<textarea name="additional_requirements"></textarea></label><button class="button" type="submit">Generate Jewelry Plan</button></form><div id="results" class="results"></div>{% endblock %}{% block scripts %}<script>initJewelryPlanner();</script>{% endblock %}
