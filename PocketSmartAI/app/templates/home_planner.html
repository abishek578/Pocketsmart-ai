{% extends "base.html" %}{% block title %}Home Planner — PocketSmart AI{% endblock %}{% block content %}
<div class="page-heading"><div><p class="eyebrow">HOME INTERIOR</p><h1>Build your room plan</h1><p class="muted">Prices are estimates. Verify live prices before purchasing.</p></div></div>
<form id="home-form" class="panel planner-form"><div class="form-grid"><label>Total budget (₹)<input name="total_budget" type="number" min="1" required placeholder="100000"></label><label>Style<input name="style" value="modern" placeholder="modern, minimalist, traditional"></label></div><label>Rooms (comma separated)<input name="rooms" value="Living Room, Bedroom" required></label><label>Additional requirements<textarea name="additional_requirements" placeholder="e.g. warm lighting, easy maintenance"></textarea></label><div><div class="panel-head"><h3>Items</h3><button type="button" class="button secondary small" onclick="addHomeItem()">+ Add item</button></div><div id="home-items"></div></div><button class="button" type="submit">Generate Home Plan</button></form><div id="results" class="results"></div>{% endblock %}{% block scripts %}<script>initHomePlanner();</script>{% endblock %}
